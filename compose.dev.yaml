# Dependencies of cadenway-task-service for working on it alone: its own PostgreSQL database and
# NATS JetStream. The service itself runs on the host with `pnpm start:dev`.
#
# The credentials below are local development values, matching .env.example.
name: cadenway-task-service-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
    ports:
      - '127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U task -d task']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    ports:
      - '127.0.0.1:${DEV_NATS_PORT:-4222}:4222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  nats-data:
