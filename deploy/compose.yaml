# Definition of task-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/task-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URLs and the
# NATS password) are referenced by name; they live in cadenway-ops, which documents every variable
# below in docs/service-environment.md. A required variable must exist on the host before the
# release that reads it: the GitOps agent refuses a commit that leaves one unset.
#
# INTERNAL_TOKEN_TRUSTED_ISSUERS lists who may call this service: the API gateway, the realtime
# gateway (access checks before a socket joins a room), and automation-service and
# integration-service (actions only). Document and Search trust can be provisioned separately.
# Search export also needs the same cursor key on each Task replica. The folded scalar gives the
# service one line of JSON.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  task-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-task-service:${TASK_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3013'
      DATABASE_URL: ${TASK_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: task
      NATS_PASSWORD: ${TASK_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: task-service
      DOCUMENT_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${DOCUMENT_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      NOTIFICATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${NOTIFICATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL:-}
      TASK_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK: ${TASK_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:-}
      SEARCH_PROJECTION_CURSOR_SECRET: ${TASK_SEARCH_PROJECTION_CURSOR_SECRET:-}
      # Off until the release that turns the trash on (docs/development.md, "Trash writes").
      TRASH_WRITES_ENABLED: ${TASK_SERVICE_TRASH_WRITES_ENABLED:-false}
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "realtime-gateway": [${REALTIME_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "automation-service": [${AUTOMATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "integration-service": [${INTEGRATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3013/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
