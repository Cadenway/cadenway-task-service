name: Bug report
description: Something in waypoint-task-service does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **A security problem must not be reported here**: follow
        .github/SECURITY.md instead. Never paste a token, a password or personal data.

  - type: input
    id: task
    attributes:
      label: Waypoint task
      description: The task id, if one already tracks this bug.
      placeholder: WAY-482

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The expected behavior, and the contract or document that defines it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send this request (method, route, body without secrets)
        2. Receive this response or this event
        3. ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local stack
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The deployed version, or the commit you ran.
      placeholder: v1.4.2

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: This report contains no secret, token or personal data.
          required: true
